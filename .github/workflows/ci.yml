name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff pytest

      - name: Ruff lint
        run: ruff check app/ eval/

      - name: Pytest suite
        # Three script-style test files call sys.exit at import time;
        # they are run directly with python below (bug-fix rounds) or
        # excluded from CI (live-integration chain test).
        run: >
          pytest tests/ -q
          --ignore=tests/test_bug_fixes_round1.py
          --ignore=tests/test_bug_fixes_round2.py
          --ignore=tests/test_skill_knowledge_full_chain.py

      - name: Bug-fix script tests
        run: |
          python tests/test_bug_fixes_round1.py
          python tests/test_bug_fixes_round2.py

      - name: Eval replay (stub LLM, offline)
        run: python eval/replay.py --all --stub-llm
